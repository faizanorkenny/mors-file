<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MORSEVIC // SCANLINE ACCESS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Share+Tech+Mono&display=swap');

        :root {
            --paper-bg: #f2f0e9;
            --ink-black: #1a1a1b;
            --re-red: #8b0000;
            --terminal-green: #00ff41;
        }

        body, html {
            margin: 0; padding: 0; min-height: 100%;
            background-color: #000; color: var(--terminal-green);
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
        }

        /* --- SCANLINE EFFECT (The Green Moving Line) --- */
        .scanline-overlay {
            position: fixed; inset: 0;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 255, 65, 0.05) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9999;
        }

        .moving-line {
            position: fixed; inset: 0;
            width: 100%; height: 3px;
            background: rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.5);
            z-index: 10000;
            pointer-events: none;
            animation: scanMove 4s linear infinite;
        }

        @keyframes scanMove {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        /* --- TERMINAL & PASSWORD --- */
        #terminal-screen {
            position: fixed; inset: 0; background: #000;
            padding: 20px; z-index: 2000;
            display: flex; flex-direction: column; overflow-y: auto;
        }

        .command-line { margin-bottom: 5px; opacity: 0; animation: fadeIn 0.1s forwards; font-size: 13px; }
        @keyframes fadeIn { to { opacity: 1; } }

        #password-gate {
            display: none; position: fixed; inset: 0;
            background: #000; z-index: 1999;
            flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center;
        }

        .input-box {
            background: transparent; border: none; border-bottom: 2px solid var(--terminal-green);
            color: var(--terminal-green); font-family: 'Share Tech Mono', monospace;
            font-size: 24px; text-align: center; outline: none;
            width: 100%; max-width: 300px; margin-top: 30px; letter-spacing: 5px;
            box-shadow: 0 10px 10px -10px var(--terminal-green);
        }

        /* --- MAIN APP --- */
        #main-app {
            display: none; min-height: 100vh; background-color: #111;
            flex-direction: column;
        }

        @media (min-width: 768px) { #main-app { flex-direction: row; } }

        .sidebar-folder {
            background: #1a1a1a; border-bottom: 2px solid #333;
            flex-shrink: 0; z-index: 50; width: 100%;
        }

        @media (min-width: 768px) {
            .sidebar-folder { width: 300px; border-bottom: none; border-right: 2px solid #333; height: 100vh; position: sticky; top: 0; }
        }

        .dossier-page {
            background-color: var(--paper-bg);
            background-image: url('https://www.transparenttextures.com/patterns/paper.png');
            color: var(--ink-black);
            font-family: 'Special Elite', cursive;
            flex-grow: 1; min-height: 100vh; position: relative;
        }

        /* Nav Tab */
        .nav-container { display: flex; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
        .nav-container::-webkit-scrollbar { display: none; }

        @media (min-width: 768px) { .nav-container { flex-direction: column; } }

        .nav-tab {
            transition: all 0.3s; border-bottom: 4px solid transparent;
            color: #555; padding: 15px 20px; font-size: 11px;
            display: flex; align-items: center; gap: 8px; text-transform: uppercase;
        }

        @media (min-width: 768px) {
            .nav-tab { border-bottom: none; border-left: 4px solid transparent; width: 100%; font-size: 14px; }
            .nav-tab.active { border-left: 4px solid var(--re-red); background: #222; }
        }

        .nav-tab.active { background: #222; color: #fff; border-bottom: 4px solid var(--re-red); }

        /* Card */
        .member-card {
            background: white; border: 1px solid rgba(0,0,0,0.1);
            padding: 12px; display: flex; align-items: center; gap: 15px;
            cursor: pointer; transition: all 0.2s;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.05);
        }
        .member-card:active { transform: scale(0.96); background: #f0f0f0; }

        /* Modal */
        #profile-modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.95); z-index: 20000;
            flex-direction: column; overflow-y: auto; padding: 15px;
        }

        .modal-paper {
            background-color: var(--paper-bg); width: 100%; max-width: 600px;
            margin: auto; padding: 30px;
            background-image: url('https://www.transparenttextures.com/patterns/paper.png');
            color: var(--ink-black); font-family: 'Special Elite', cursive;
            position: relative; border-radius: 2px;
        }

        .stamp {
            border: 2px double var(--re-red); color: var(--re-red);
            padding: 2px 8px; text-transform: uppercase;
            font-weight: bold; display: inline-block;
            transform: rotate(-3deg); font-size: 11px; margin-bottom: 10px;
        }

        .close-btn {
            position: fixed; top: 15px; right: 15px;
            background: var(--re-red); color: white;
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; z-index: 20001;
        }
    </style>
</head>
<body>

    <!-- Static and Moving Scanlines -->
    <div class="scanline-overlay"></div>
    <div class="moving-line"></div>

    <div id="terminal-screen"></div>

    <div id="password-gate">
        <h2 class="text-xl tracking-[0.3em] text-red-600 font-bold mb-1">UNAUTHORIZED LINK</h2>
        <p class="text-[9px] opacity-40 mb-10 uppercase font-mono">ENCRYPTION: 256-BIT // MORSEVIC G.I.N.</p>
        <p class="text-xs font-mono uppercase text-green-500">Enter Access Key:</p>
        <input type="password" id="pass-input" class="input-box" autofocus autocomplete="off">
        <p id="error-msg" class="text-red-600 mt-6 hidden text-[10px] font-mono">ERROR: INVALID KEY</p>
    </div>

    <div id="main-app">
        <aside class="sidebar-folder p-6 md:p-8 font-mono">
            <div class="mb-8 md:mb-12">
                <h1 class="text-white text-2xl font-bold tracking-tighter">MORSEVIC</h1>
                <div class="h-1 w-12 bg-red-700 mt-1"></div>
                <p class="text-red-500 text-[9px] mt-2 tracking-[0.2em] uppercase">Confidential Database</p>
            </div>
            <nav class="nav-container">
                <button onclick="loadSection('legacy')" id="btn-legacy" class="nav-tab active">LEGACY</button>
                <button onclick="loadSection('bfi')" id="btn-bfi" class="nav-tab">B.F.I.</button>
                <button onclick="loadSection('hee')" id="btn-hee" class="nav-tab">H.E.E.</button>
                <button onclick="loadSection('core')" id="btn-core" class="nav-tab">C.O.R.E.</button>
                <button onclick="loadSection('sin')" id="btn-sin" class="nav-tab">S.I.N.</button>
            </nav>
        </aside>

        <main class="dossier-page p-6 md:p-16 overflow-y-auto">
            <div id="content-screen" class="max-w-4xl mx-auto opacity-0 transition-opacity duration-300 pb-20"></div>
        </main>
    </div>

    <div id="profile-modal">
        <button class="close-btn" onclick="closeModal()">✕</button>
        <div class="modal-paper" id="modal-content"></div>
    </div>

    <script>
        const terminal = document.getElementById('terminal-screen');
        const logs = [
            "DECRYPTING_BIO_LAYER...",
            "RETRIEVING_FACTION_INDEX...",
            "BYPASSING_CORE_FIREWALL...",
            "SYNCING_BFI_DOSSIERS...",
            "SYNCING_HEE_DOSSIERS...",
            "SYNCING_CORE_DOSSIERS...",
            "SYNCING_SIN_DOSSIERS...",
            "SUCCESS. ACCESS_GRANTED."
        ];
        
        let i = 0;
        function showLogs() {
            if (i < logs.length) {
                let div = document.createElement('div');
                div.className = 'command-line';
                div.textContent = `> ${logs[i]}`;
                terminal.appendChild(div);
                i++;
                setTimeout(showLogs, 120);
            } else {
                setTimeout(() => {
                    terminal.style.display = 'none';
                    document.getElementById('password-gate').style.display = 'flex';
                    document.getElementById('pass-input').focus();
                }, 500);
            }
        }

        const passInput = document.getElementById('pass-input');
        passInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (passInput.value.toLowerCase() === 'bloodline') {
                    document.getElementById('password-gate').style.display = 'none';
                    document.getElementById('main-app').style.display = 'flex';
                    loadSection('legacy');
                } else {
                    document.getElementById('error-msg').classList.remove('hidden');
                    passInput.value = '';
                }
            }
        });

        const db = {
            legacy: {
                title: "THE GENESIS",
                subtitle: "Bloodline Origins",
                stamp: "TOP SECRET",
                body: `<p class="mb-4">The Morsevic Dynasty is not just a family—it is an architectural blueprint for the next phase of human biology.</p>
                <p class="mb-4">Since the 1920s, secret labs have refined the "Bloodline" pathogen, leading to the current state of global factional warfare.</p>
                <div class="mt-8 p-4 border-2 border-black/10 bg-black/5 font-mono text-[11px]">
                    <p class="font-bold underline mb-2">ACCESS DIRECTORY:</p>
                    <p>> B.F.I: Containment & Purge</p>
                    <p>> H.E.E: Experimental Survivors</p>
                    <p>> C.O.R.E: Corporate Architects</p>
                    <p>> S.I.N: Shadow Networks</p>
                </div>`
            },
            bfi: {
                title: "B.F.I.",
                subtitle: "Bureau of Federal Investigation",
                stamp: "AUTHORIZED",
                desc: "Federal containment units active in North American sectors.",
                members: [
                    { name: "Elowen Vaire", nick: "Valkyrie", role: "Field Director", bio: "Former spec-ops commander. Unwavering loyalty to the containment mission.", note: "High-value asset. Direct all field reports to her." },
                    { name: "Noa Fern", nick: "Sledge", role: "Tactical Specialist", bio: "Heavy breach expert. Only survivor of the sector-7 incident.", note: "Physical strength exceeds standard human limits." },
                    { name: "Christabel Gwyneth", nick: "Oracle", role: "Data Analyst", bio: "Digital ghost tracker. Can find anyone through a live neural-net.", note: "Strictly non-combat but essential for intel." },
                    { name: "Abiorne Salnoure", nick: "Ranger", role: "Sniper", bio: "Long-range deterrent. Never misses. Never seen.", note: "Stationed in high-altitude perches." },
                    { name: "Nilover Aster", nick: "Rookie", role: "Field Agent", bio: "Gifted young operative with an uncanny intuition for SIN traps.", note: "Promising but emotionally volatile." }
                ]
            },
            hee: {
                title: "H.E.E.",
                subtitle: "Human Entity Experiment",
                stamp: "SUBJECTS",
                desc: "Biological anomalies resulting from the V-Series infection.",
                members: [
                    { name: "Maivelyn Lune", nick: "Phase-Zero", role: "Primary Subject", bio: "Displays the most stable integration of the Morsevic virus.", note: "Subject shows signs of high intelligence and empathy." },
                    { name: "Estheric Lürn", nick: "Sentinel", role: "Tank Unit", bio: "Chitin-based bone growth. Near-immune to kinetic impact.", note: "Armor is growing daily." },
                    { name: "Mayla Lilou", nick: "Siren", role: "Disruptor", bio: "Ultrasound vocal capability. Can disable electronics with a scream.", note: "Keep isolated in sound-proof containment." },
                    { name: "Nala Eulalie", nick: "Specter", role: "Stealth", bio: "Light-refracting skin cells. Master of ambush.", note: "Subject is difficult to document visually." }
                ]
            },
            core: {
                title: "C.O.R.E.",
                subtitle: "Central Ops & Research Executive",
                stamp: "BOARD",
                desc: "The financiers and masterminds of the bio-war.",
                members: [
                    { name: "Caleb Dominic", nick: "Architect", role: "CEO", bio: "The face of modern medicine, hiding the face of ancient greed.", note: "Never seen in person. Communicates via proxy." },
                    { name: "Kenny Harris", nick: "Quartermaster", role: "Logistics", bio: "Controls the flow of resources. Every shipment is tracked by him.", note: "If he stops, the war stops." },
                    { name: "Eliana Aisnith", nick: "Legal Counsel", role: "The Fixer", bio: "Handles all international treaty violations.", note: "Dangerous. Can silence a nation with one phone call." },
                    { name: "Issa Meryche", nick: "Science Lead", role: "Research Director", bio: "Head of the mutation program. No ethics, only results.", note: "Requested more HEE subjects for 'Phase 2'." }
                ]
            },
            sin: {
                title: "S.I.N.",
                subtitle: "Shadow Intelligence Network",
                stamp: "TERMINATE",
                desc: "The dark collective pursuing total evolutionary dominance.",
                members: [
                    { name: "Renée Corven", nick: "Matriarch", role: "Command", bio: "The true heir to the Morsevic legacy. Seeking global infection.", note: "Termination is the only solution." },
                    { name: "Kansa Lalita", nick: "Blade", role: "Assassin", bio: "Shadow-blade specialist. Faster than the human eye.", note: "Avoid melee range at all costs." },
                    { name: "Méisy Blythe", nick: "Viper", role: "Toxicologist", bio: "Developer of the Blue-Mist toxin.", note: "No antidote exists. Wear protection." },
                    { name: "Wyssie Rou", nick: "Mirror", role: "Spy", bio: "Master of mimicry and psychological warfare.", note: "Often infiltrates BFI outposts disguised as staff." }
                ]
            }
        };

        function loadSection(id) {
            const screen = document.getElementById('content-screen');
            const data = db[id];
            
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`btn-${id}`).classList.add('active');

            screen.style.opacity = 0;
            setTimeout(() => {
                let html = `
                    <div class="mb-10 border-b-2 border-black/20 pb-4">
                        <div class="stamp">${data.stamp}</div>
                        <h2 class="text-3xl md:text-4xl font-bold uppercase tracking-tight">${data.title}</h2>
                        <h3 class="text-[10px] md:text-sm text-gray-500 font-mono italic">${data.subtitle}</h3>
                    </div>
                `;

                if (id === 'legacy') {
                    html += data.body;
                } else {
                    html += `<p class="text-[11px] italic mb-8 border-l-4 border-red-800 pl-3 bg-red-800/5 py-1 uppercase">${data.desc}</p>`;
                    html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
                    data.members.forEach((m, idx) => {
                        html += `
                            <div class="member-card" onclick="openProfile('${id}', ${idx})">
                                <div class="w-12 h-16 bg-gray-200 shrink-0 flex items-center justify-center text-xl opacity-20">👤</div>
                                <div class="overflow-hidden">
                                    <div class="text-red-900 font-bold text-sm uppercase truncate">${m.name}</div>
                                    <div class="text-[10px] bg-black text-white inline-block px-1 mt-1">"${m.nick}"</div>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
                screen.innerHTML = html;
                screen.style.opacity = 1;
            }, 250);
        }

        function openProfile(faksi, idx) {
            const m = db[faksi].members[idx];
            const modal = document.getElementById('profile-modal');
            const content = document.getElementById('modal-content');

            content.innerHTML = `
                <div class="stamp mb-4">${db[faksi].stamp} // FILE_${idx + 101}</div>
                <div class="flex flex-col md:flex-row gap-8">
                    <div class="text-center md:text-left shrink-0">
                        <div class="w-32 h-40 bg-gray-300 mx-auto border-4 border-white shadow-md flex items-center justify-center text-4xl opacity-10 mb-4">👤</div>
                        <h2 class="text-2xl font-bold font-sans">${m.name}</h2>
                        <div class="bg-red-900 text-white px-3 py-0.5 inline-block mt-2 font-mono text-xs font-bold uppercase">"${m.nick}"</div>
                    </div>
                    <div class="space-y-4 text-sm">
                        <div>
                            <span class="font-bold underline block text-[10px] uppercase">Assigned Role:</span>
                            <span>${m.role}</span>
                        </div>
                        <div>
                            <span class="font-bold underline block text-[10px] uppercase">Background Intel:</span>
                            <p class="leading-relaxed text-xs font-sans">${m.bio}</p>
                        </div>
                        <div class="bg-red-800/10 p-4 border-l-4 border-red-800 font-mono text-[11px] italic">
                            <span class="font-bold text-red-800 block not-italic mb-1">COMMANDER'S NOTES:</span>
                            "${m.note}"
                        </div>
                    </div>
                </div>
            `;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('profile-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onload = showLogs;
    </script>
</body>
</html>
