<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORSEVIC // MOBILE ACCESS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Share+Tech+Mono&display=swap');

        :root {
            --paper-bg: #f2f0e9;
            --ink-black: #1a1a1b;
            --re-red: #8b0000;
            --terminal-green: #00ff41;
        }

        body, html {
            margin: 0; padding: 0; min-height: 100%;
            background-color: #000; color: var(--terminal-green);
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
        }

        /* --- LOADING TERMINAL --- */
        #terminal-screen {
            position: fixed; inset: 0; background: #000;
            padding: 15px; z-index: 1000;
            display: flex; flex-direction: column; overflow-y: auto;
            font-size: 13px;
        }

        .command-line { margin-bottom: 5px; opacity: 0; animation: fadeIn 0.1s forwards; }
        @keyframes fadeIn { to { opacity: 1; } }

        /* --- PASSWORD GATE --- */
        #password-gate {
            display: none; position: fixed; inset: 0;
            background: #000; z-index: 1001;
            flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center;
        }

        .input-box {
            background: transparent; border: none; border-bottom: 2px solid var(--terminal-green);
            color: var(--terminal-green); font-family: 'Share Tech Mono', monospace;
            font-size: 22px; text-align: center; outline: none;
            width: 100%; max-width: 280px; margin-top: 25px; letter-spacing: 4px;
        }

        /* --- MAIN APP LAYOUT (MOBILE FIRST) --- */
        #main-app {
            display: none; min-height: 100vh; background-color: #111;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            #main-app { flex-direction: row; }
        }

        .sidebar-folder {
            background: #2d2d2d; border-bottom: 2px solid #444;
            flex-shrink: 0; z-index: 50; width: 100%;
        }

        @media (min-width: 768px) {
            .sidebar-folder { width: 300px; border-bottom: none; border-right: 2px solid #444; }
        }

        .dossier-page {
            background-color: var(--paper-bg);
            background-image: url('https://www.transparenttextures.com/patterns/paper.png');
            color: var(--ink-black);
            font-family: 'Special Elite', cursive;
            flex-grow: 1; min-height: 100vh;
        }

        /* Nav Tab Mobile: Scrollable Horizontal */
        .nav-container {
            display: flex; overflow-x: auto; white-space: nowrap;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .nav-container::-webkit-scrollbar { display: none; }

        @media (min-width: 768px) {
            .nav-container { flex-direction: column; overflow-x: visible; }
        }

        .nav-tab {
            transition: all 0.3s; border-bottom: 4px solid transparent;
            color: #999; padding: 15px 20px; font-size: 14px;
            display: flex; align-items: center; gap: 8px;
        }

        @media (min-width: 768px) {
            .nav-tab { border-bottom: none; border-left: 4px solid transparent; width: 100%; }
            .nav-tab.active { border-left: 4px solid var(--re-red); border-bottom: none; }
        }

        .nav-tab.active {
            background: #3d3d3d; color: #fff; border-bottom: 4px solid var(--re-red);
        }

        /* --- MODAL DESIGN --- */
        #profile-modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.95); z-index: 2000;
            align-items: center; justify-content: center; padding: 15px;
        }

        .modal-paper {
            background-color: var(--paper-bg); width: 100%; max-width: 750px;
            max-height: 90vh; overflow-y: auto; padding: 25px;
            background-image: url('https://www.transparenttextures.com/patterns/paper.png');
            box-shadow: 0 0 40px rgba(0,0,0,0.7); color: var(--ink-black);
            font-family: 'Special Elite', cursive;
            position: relative;
            border-radius: 4px;
        }

        .stamp {
            border: 3px double var(--re-red); color: var(--re-red);
            padding: 4px 10px; text-transform: uppercase;
            font-weight: bold; display: inline-block;
            transform: rotate(-5deg); font-size: 11px;
        }

        .photo-box {
            width: 120px; height: 150px; background: #ddd; border: 4px solid #fff;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1); margin: 0 auto;
        }

        .scanline {
            width: 100%; height: 2px; background: rgba(0, 255, 65, 0.05);
            position: absolute; top: 0; left: 0; pointer-events: none;
            animation: scan 6s linear infinite; z-index: 2001;
        }
        @keyframes scan { from { top: 0; } to { top: 100%; } }
    </style>
</head>
<body>

    <!-- Terminal Screen -->
    <div id="terminal-screen"></div>

    <!-- Password Gate -->
    <div id="password-gate">
        <div class="scanline"></div>
        <div class="mb-6">
            <h2 class="text-xl tracking-widest text-red-600 font-bold underline">RESTRICTED ACCESS</h2>
            <p class="text-[10px] mt-2 opacity-60">AUTHORIZED PERSONNEL ONLY</p>
        </div>
        <p class="mt-4 text-sm font-mono">ENCRYPTION KEY:</p>
        <input type="password" id="pass-input" class="input-box" autofocus autocomplete="off">
        <p id="error-msg" class="text-red-600 mt-6 hidden text-xs">DECRYPTION FAILED. ACCESS DENIED.</p>
        <div class="mt-16 opacity-20 text-[9px] uppercase tracking-widest">Morsevic Global Intelligence Network</div>
    </div>

    <!-- Main App -->
    <div id="main-app">
        <!-- Sidebar Navigation -->
        <aside class="sidebar-folder p-5 md:p-8 font-mono">
            <div class="mb-5 md:mb-12">
                <h1 class="text-white text-2xl font-bold tracking-tighter">MORSEVIC</h1>
                <div class="h-1 w-12 bg-red-700 mt-1"></div>
                <p class="text-red-500 text-[10px] mt-2 tracking-[0.2em]">CLASSIFIED DOSSIER</p>
            </div>
            <nav class="nav-container">
                <button onclick="loadSection('legacy')" id="btn-legacy" class="nav-tab active">
                    <span class="opacity-50 text-[10px]">00</span> LEGACY
                </button>
                <button onclick="loadSection('bfi')" id="btn-bfi" class="nav-tab">
                    <span class="opacity-50 text-[10px]">01</span> B.F.I.
                </button>
                <button onclick="loadSection('hee')" id="btn-hee" class="nav-tab">
                    <span class="opacity-50 text-[10px]">02</span> H.E.E.
                </button>
                <button onclick="loadSection('core')" id="btn-core" class="nav-tab">
                    <span class="opacity-50 text-[10px]">03</span> C.O.R.E.
                </button>
                <button onclick="loadSection('sin')" id="btn-sin" class="nav-tab">
                    <span class="opacity-50 text-[10px]">04</span> S.I.N.
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="dossier-page p-5 md:p-16 overflow-y-auto">
            <div id="content-screen" class="max-w-4xl mx-auto opacity-0 transition-opacity duration-500 pb-20"></div>
        </main>
    </div>

    <!-- Profile Modal -->
    <div id="profile-modal" onclick="closeModal(event)">
        <div class="modal-paper" id="modal-content" onclick="event.stopPropagation()"></div>
    </div>

    <script>
        // --- BOOT SEQUENCE ---
        const terminal = document.getElementById('terminal-screen');
        const bootLogs = [
            "MORSEVIC_BOOT_V4.0 (MOBILE_ENABLED)...",
            "Checking local decryption modules...",
            "Loading responsive asset maps...",
            "Decrypting node 127.0.0.1...",
            "Establishing neural link...",
            "READY.",
            "PLEASE ENTER AUTHORIZATION CODE."
        ];

        let logIdx = 0;
        function typeLog() {
            if (logIdx < bootLogs.length) {
                const line = document.createElement('div');
                line.className = 'command-line';
                line.textContent = `> ${bootLogs[logIdx]}`;
                terminal.appendChild(line);
                logIdx++;
                setTimeout(typeLog, 120 + Math.random() * 100);
            } else {
                setTimeout(() => {
                    terminal.style.display = 'none';
                    document.getElementById('password-gate').style.display = 'flex';
                    document.getElementById('pass-input').focus();
                }, 800);
            }
        }

        // --- PASSWORD LOGIC ---
        const passInput = document.getElementById('pass-input');
        passInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (passInput.value.toLowerCase() === 'bloodline') {
                    document.getElementById('password-gate').style.display = 'none';
                    document.getElementById('main-app').style.display = 'flex';
                    loadSection('legacy');
                } else {
                    document.getElementById('error-msg').classList.remove('hidden');
                    passInput.value = '';
                    setTimeout(() => { document.getElementById('error-msg').classList.add('hidden'); }, 2000);
                }
            }
        });

        // --- DATA ---
        const sections = {
            legacy: {
                title: "MORSEVIC LEGACY",
                subtitle: "The Family Origin",
                stamp: "TOP SECRET",
                content: `
                    <div class="prose max-w-none text-sm md:text-base leading-relaxed">
                        <p class="mb-4 font-bold text-red-900">"The blood of the family is the ink of history."</p>
                        <p class="mb-6">The Morsevic Dynasty has controlled global biotechnology for decades. What started as a pharmaceutical empire evolved into a secret war between four powerful factions.</p>
                        <div class="bg-black/5 border-2 border-black/10 p-5 rounded font-mono text-xs">
                            <h3 class="font-bold mb-3 border-b border-black/20 pb-1">FACTION SUMMARY:</h3>
                            <p class="mb-2"><strong>B.F.I:</strong> Federal hunters containing the outbreak.</p>
                            <p class="mb-2"><strong>H.E.E:</strong> Survivors of the secret experiments.</p>
                            <p class="mb-2"><strong>C.O.R.E:</strong> The corporate leadership hiding the truth.</p>
                            <p><strong>S.I.N:</strong> Hostile shadow network seeking global infection.</p>
                        </div>
                    </div>
                `
            },
            bfi: {
                title: "B.F.I. FILES",
                subtitle: "Rescue & Containment",
                stamp: "AUTHORIZED",
                description: "The primary response team assigned to stabilize the Morsevic fallout.",
                members: [
                    { name: "Elowen Vaire", nick: "Valkyrie", age: 34, gen: "Female", role: "Field Director", bio: "Leading the purge of the family name.", note: "Priority Alpha target." },
                    { name: "Noa Fern", nick: "Sledge", age: 29, gen: "Male", role: "Tactical Specialist", bio: "Breach expert and heavy weapon handler.", note: "Ex-S.A.T. operative." }
                ]
            },
            hee: {
                title: "H.E.E. SUBJECTS",
                subtitle: "Human Entity Experiment",
                stamp: "RECOVERED",
                description: "Survivors retrieved from the Delta Laboratory stasis tanks.",
                members: [
                    { name: "Maivelyn Lune", nick: "Phase-Zero", age: 31, gen: "Female", role: "Lead Subject", bio: "A scientist who became her own experiment.", note: "Displays high regeneration." },
                    { name: "Estheric Lürn", nick: "Sentinel", age: 33, gen: "Male", role: "Guard", bio: "Volunteer for the Armor Skin project.", note: "Skin is bullet-resistant." }
                ]
            },
            core: {
                title: "C.O.R.E. EXEC",
                subtitle: "Board of Directors",
                stamp: "EXECUTIVE",
                description: "The legal face of the Morsevic global holdings.",
                members: [
                    { name: "Caleb Dominic", nick: "Architect", age: 52, gen: "Male", role: "CEO", bio: "Founder of the modern research hubs.", note: "Extremely well protected." },
                    { name: "Kenny Harris", nick: "Quartermaster", age: 48, gen: "Male", role: "Logistics", bio: "Manages the global supply of bio-data.", note: "Possible traitor." }
                ]
            },
            sin: {
                title: "S.I.N. THREATS",
                subtitle: "Shadow Intelligence",
                stamp: "TERMINATE",
                description: "Rogue elements pursuing the complete 'Bloodline' evolution.",
                members: [
                    { name: "Renée Corven", nick: "Matriarch", age: 45, gen: "Female", role: "Leader", bio: "Believes biological purity is the only way.", note: "Shoot on sight." },
                    { name: "Kansa Lalita", nick: "Ghost-Blade", age: 32, gen: "Male", role: "Assassin", bio: "High-tech killer with optical camouflage.", note: "No thermal signature." }
                ]
            }
        };

        function loadSection(id) {
            const screen = document.getElementById('content-screen');
            const data = sections[id];
            document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${id}`).classList.add('active');
            
            screen.style.opacity = 0;
            setTimeout(() => {
                let html = `
                    <div class="mb-8 border-b-2 border-black/20 pb-5">
                        <div class="flex flex-col md:flex-row md:justify-between md:items-end gap-4">
                            <div>
                                <h2 class="text-2xl md:text-4xl font-bold uppercase tracking-tight">${data.title}</h2>
                                <h3 class="text-xs md:text-lg text-gray-500 font-mono italic mt-1">${data.subtitle}</h3>
                            </div>
                            <div class="stamp self-start">${data.stamp}</div>
                        </div>
                    </div>
                `;

                if (id === 'legacy') { 
                    html += data.content; 
                } else {
                    html += `
                        <p class="text-sm italic mb-8 border-l-4 border-red-800 pl-4 bg-red-800/5 py-2">${data.description}</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${data.members.map((m, index) => `
                                <div onclick="openProfile('${id}', ${index})" class="bg-white p-4 border border-black/10 shadow-sm flex items-center gap-4 cursor-pointer hover:bg-gray-50 active:scale-[0.98] transition-all">
                                    <div class="flex-shrink-0">
                                        <div class="photo-box !w-16 !h-20 md:!w-24 md:!h-28">
                                            <span class="text-2xl opacity-10">👤</span>
                                        </div>
                                    </div>
                                    <div class="flex-grow font-mono text-[10px] md:text-xs">
                                        <div class="text-base md:text-xl font-bold font-sans text-red-900">${m.name}</div>
                                        <div class="mt-1 flex gap-2">
                                            <span class="bg-black text-white px-1.5 py-0.5 uppercase">"${m.nick}"</span>
                                        </div>
                                        <div class="mt-2 opacity-60">ROLE: ${m.role}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>`;
                }
                screen.innerHTML = html;
                screen.style.opacity = 1;
            }, 250);
        }

        function openProfile(sectionId, memberIdx) {
            const member = sections[sectionId].members[memberIdx];
            const modal = document.getElementById('profile-modal');
            const modalContent = document.getElementById('modal-content');
            
            modalContent.innerHTML = `
                <button onclick="closeModalDirect()" class="absolute top-4 right-4 bg-red-900 text-white w-10 h-10 flex items-center justify-center font-sans font-bold shadow-lg">X</button>
                <div class="flex flex-col md:flex-row gap-8">
                    <div class="w-full md:w-1/3 text-center md:border-r border-black/10 md:pr-8">
                        <div class="photo-box !w-32 !h-40 mb-4 bg-white">
                             <span class="text-5xl opacity-5">👤</span>
                        </div>
                        <h2 class="text-2xl font-bold font-sans mb-1">${member.name}</h2>
                        <div class="bg-red-900 text-white inline-block px-3 py-1 font-mono text-sm font-bold mb-4 uppercase">"${member.nick}"</div>
                        <div class="text-[11px] font-mono text-left space-y-2 border-t border-black/10 pt-4">
                            <div class="flex justify-between"><span class="opacity-50">AGE:</span><span>${member.age}</span></div>
                            <div class="flex justify-between"><span class="opacity-50">GENDER:</span><span>${member.gen}</span></div>
                            <div class="flex justify-between"><span class="opacity-50">ROLE:</span><span>${member.role}</span></div>
                        </div>
                    </div>
                    <div class="w-full md:w-2/3">
                        <div class="stamp mb-4 text-[10px]">${sections[sectionId].stamp} FILE</div>
                        <h3 class="text-sm font-bold border-b border-black pb-1 mb-3 uppercase">BACKGROUND</h3>
                        <p class="text-xs md:text-sm font-sans mb-6 leading-relaxed">${member.bio}</p>
                        <h3 class="text-sm font-bold border-b border-black pb-1 mb-3 uppercase">SUPERVISOR NOTES</h3>
                        <div class="p-4 bg-red-900/5 border-l-4 border-red-900 font-mono text-[10px] italic">"${member.note}"</div>
                        <div class="mt-10 opacity-10 text-[8px] uppercase font-mono">End of File. Property of Morsevic Group.</div>
                    </div>
                </div>`;
            
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModalDirect() {
            document.getElementById('profile-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function closeModal(e) { if(e.target.id === 'profile-modal') closeModalDirect(); }

        window.onload = typeLog;
    </script>
</body>
</html>
